    <path d="M 64 20 L 64 108 M 50 35 Q 50 28 58 28 L 70 28 Q 78 28 78 35 Q 78 42 70 42 L 58 42 L 58 56 L 70 56 Q 78 56 78 63 Q 78 70 70 70 L 58 70 Q 50 70 50 77 Q 50 84 58 84 L 70 84 Q 78 84 78 91 Q 78 98 70 98 L 58 98 Q 50 98 50 91"
          stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

